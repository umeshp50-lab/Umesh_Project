name: CI Pipeline

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:

  source-code-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Java installation
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Enable this when SonarCloud is configured
      # - name: SonarQube scan
      #   uses: SonarSource/sonarcloud-github-action@v3
      #   env:
      #     SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}


  container-validation:
    runs-on: ubuntu-latest
    needs: source-code-validation

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

     # - name: Docker build
     #   run: |
     #    docker build -t landingzone:latest .

    #  - name: Docker scan with Trivy
    #    uses: aquasecurity/trivy-action@master
    #    with:
    #      image-ref: landingzone:latest
    #      severity: HIGH,CRITICAL
    #      exit-code: '1'
    #     ignore-unfixed: true


  infrastructure-validation:
    runs-on: ubuntu-latest
    needs: container-validation

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Terraform installation
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.13.0'

      - name: Azure Login
        if: false
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init
        run: terraform init
        working-directory: ./Terraform/environment/dev

      - name: Terraform Validate
        run: terraform validate
        working-directory: ./Terraform/environment/dev

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: TFLint
        run: |
          tflint --init
          tflint --minimum-failure-severity=error
        working-directory: ./Terraform/environment/dev

      - name: Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: ./Terraform/environment/
          soft_fail: true

      - name: Terraform Plan
        run: terraform plan -out=tfplan
        working-directory: ./Terraform/environment/dev

      - name: Artifact Upload
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: ./Terraform/environment/dev/tfplan
